[project]
name = "faceit-intelligence-backend"
version = "0.1.0"
description = "FACEIT / CS2 analytics API: player stats, demo parsing, matchmaking research"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "demoparser2==0.42.0",  # 0.42.1 ships Windows-only wheels
    "zstandard>=0.22",
    "sqlalchemy>=2.0",
    "itsdangerous>=2.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: FastAPI File()/Query() defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"app/synthetic.py" = ["B023"]  # closures are called within the same loop iteration

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
